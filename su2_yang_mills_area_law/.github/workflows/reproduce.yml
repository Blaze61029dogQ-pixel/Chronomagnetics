# SPDX-License-Identifier: MIT
# CI for the standalone repository layout (repository root = this directory).
# When this directory is a subfolder of another repository, GitHub does not
# read this file; the host repository needs its own workflow at its root.
name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Integrity checks and tests
        run: make check PYTHON=python

  # Quick scientific reproduction. The job fails whenever any check FAILs.
  # As of 2026-09-30 it is EXPECTED TO FAIL on check S1/1.25 because
  # levin_N3_certificate.py (Theorem 3.9) is not in the repository. The
  # failure is not suppressed.
  quick-reproduction:
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Quick reproduction
        run: python reproduction/run_reproduction.py --outdir ci-output/quick
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-reproduction
          path: ci-output/quick

  # Full reproduction with the papers' grids (about 2 minutes on the
  # recording machine). Manual trigger only.
  full-reproduction:
    if: github.event_name == 'workflow_dispatch'
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Full reproduction
        run: python reproduction/run_reproduction.py --full --outdir ci-output/full
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-reproduction
          path: ci-output/full
