name: Bug report
description: A defect in repository tooling, documentation or metadata.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: File(s) affected
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
